<!-- frontend/public/pages/login.html -->
<div class="login-bg">
    <div class="login-card-container">
        <div style="margin-bottom: 24px; text-align: center;">
            <!-- Logo 圖案 -->
            <img src="assets/sefelogo.png" alt="Xiefei Logo"
                style="max-height: 80px; width: auto; margin-bottom: 16px;">
            <h2 style="margin: 0; font-size: 24px; color: var(--primary-blue); font-weight: 700;">協飛企業有限公司</h2>
            <h3
                style="margin: 4px 0 0 0; font-size: 16px; color: var(--text-secondary); font-weight: 400; letter-spacing: 1px;">
                產品詢價系統</h3>
        </div>

        <form id="login-form">
            <div style="margin-bottom: 20px;">
                <label for="username">帳號</label>
                <input type="text" id="username" name="username" required autocomplete="off" placeholder="請輸入使用者帳號">
            </div>
            <div style="margin-bottom: 24px;">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required autocomplete="off" placeholder="請輸入登入密碼">
            </div>

            <div style="margin-bottom: 24px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="remember_me" name="remember_me"
                    style="width: 18px; height: 18px; cursor: pointer;">
                <label for="remember_me"
                    style="margin: 0; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: 400;">記住我
                    (30 天內保持登入)</label>
            </div>

            <button type="submit" id="login-button" class="btn btn-primary"
                style="width:100%; padding: 12px; font-size: 16px;">
                <span>登入</span>
                <span class="loader" style="display: none; margin-left: 8px;">...</span>
            </button>
            <p class="error-message" id="form-error"
                style="color:var(--accent-red); margin-top:16px; text-align: center; font-size: 14px; min-height: 21px;">
            </p>
        </form>

        <div style="margin-top: 30px; text-align: center; border-top: 1px solid #eee; padding-top: 20px;">
            <span style="font-size: 12px; color: #999;">© Xiefei Enterprise Co., Ltd. All Rights Reserved.</span>
        </div>
    </div>
</div>
