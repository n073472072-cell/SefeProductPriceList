<style>
    /* 整個文章編輯區 */
    .article-editor {
        max-width: 760px;
        /* 👈 文章編輯器標準寬度 */
        margin: 40px auto;
        padding: 0 16px;
        /* 手機保護邊距 */
    }

    /* 標題輸入框：去除邊框，只留底線感或簡潔外觀 */
    #news-title {
        width: 100%;
        padding: 8px 0;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
        border: none;
        border-bottom: 1px solid #eee;
        outline: none;
        transition: border-color 0.2s;
    }

    #news-title:focus {
        border-bottom-color: var(--primary-blue);
    }

    /* 內容編輯器 */
    #editor-container {
        min-height: 420px;
        max-height: 60vh;
        /* 限制編輯器高度，避免發布按鈕被推到視窗外 */
        overflow-y: auto;
        /* 內容過多時顯示滾動條 */
        font-size: 16px;
        line-height: 1.7;
        border: none !important;
    }

    /* 外觀用 */
    .editor-wrapper {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        overflow: hidden;
    }

    .ql-toolbar.ql-snow {
        border: none !important;
        border-bottom: 1px solid #eee !important;
        background: #fafafa;
    }
</style>

<div class="news-management article-editor" style="position: relative; padding-bottom: 50px;">
    <div style="margin-bottom:30px; text-align: center;">
        <h2 style="color: var(--primary-blue); font-size: 24px;">發布最新消息</h2>
        <p style="color: var(--text-secondary);">撰寫內容並預覽後發布至首頁公告</p>
    </div>

    <form id="news-form">
        <div class="form-group">
            <input type="text" id="news-title" placeholder="請輸入文章標題..." required>
        </div>

        <div class="form-group">
            <!-- Quill Editor Container -->
            <div class="editor-wrapper">
                <div id="editor-container"></div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
            <div>
                <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">發布公告</button>
                <button type="button" id="preview-btn" class="btn btn-secondary"
                    style="margin-left: 10px; padding: 10px 24px;">
                    預覽公告
                </button>
            </div>
            <button type="button" onclick="window.location.hash='#/dashboard'" class="btn btn-secondary"
                style="display: flex; align-items: center; gap: 8px; padding: 10px 20px;">
                <span>🏠</span> 返回首頁
            </button>
        </div>
    </form>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 800px; width: 95%;">
            <div
                style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0; color: var(--text-secondary);">公告預覽</h3>
                <span style="font-size: 12px; color: #999;">預覽模式</span>
            </div>
            <h1 id="preview-title"
                style="margin: 0 0 20px 0; color: var(--primary-blue); font-size: 32px; text-align: center;"></h1>
            <div id="preview-content" class="ql-editor" style="margin:20px 0; line-height: 1.8; font-size: 16px;"></div>
            <div style="text-align: right; border-top: 1px solid #eee; padding-top: 20px;">
                <button type="button" id="close-preview" class="btn btn-secondary">關閉預覽</button>
            </div>
        </div>
    </div>

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</div>
