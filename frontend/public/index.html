<!-- frontend/public/index.html -->
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 協飛產品詢價系統</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Quill CCS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        /* 基礎樣式 */
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #f0f2f5;
            min-height: 100vh;
        }

        /* 讓 #app 撐開而不是置中卡片，方便各頁面自訂佈局 */
        #app {
            background: transparent;
            width: 100%;
            height: 100%;
            box-shadow: none;
            padding: 0;
            display: block;
            /* 移除 flex 限制 */
        }

        /* 針對舊有卡片式登入頁面保留置中樣式 (可在各頁面 CSS 調整，或全域調整) */

        /* Quill 編輯器樣式優化 - 仿 Word A4 紙張 */
        .ql-container {
            font-size: 16px;
            font-family: 'Times New Roman', serif;
            /* 預設襯線字體更有文件感 */
        }

        .a4-page {
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 40px;
            min-height: 800px;
            /* A4 比例感覺 */
            width: 21cm;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>載入中...</h1>
    </div>

    <script src="/js/utils/api.js"></script>
    <script src="/js/utils/auth.js"></script>
    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="/router.js?v=1.0.1"></script>
    <script src="/js/app.js"></script>
</body>

</html>
